<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1d23">
  <title>Pitch</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pitch">
</head>
<body>
  <header class="bar">
    <h1>Pitch</h1>
    <nav>
      <button data-view="train" class="tab active">練習</button>
      <button data-view="history" class="tab">紀錄</button>
      <button data-view="settings" class="tab">設定</button>
    </nav>
  </header>

  <main>
    <section id="view-train" class="view">
      <div id="start-pane" class="pane">
        <p class="hint">兩個音依序播放，判斷哪個比較高，或是一樣。選擇干擾程度即開始。</p>
        <div class="modes">
          <button data-level="0"><b>無干擾</b><span>兩音同一個音色</span></button>
          <button data-level="1"><b>一般干擾</b><span>兩音各自隨機音色、音量微差</span></button>
          <button data-level="2"><b>陷阱</b><span>較高的音多半較暗，同音題亮度差很大</span></button>
        </div>
      </div>

      <div id="trial-pane" hidden>
        <div class="topline">
          <div class="mini">
            <span><b id="st-n">0</b>題</span>
            <span><b id="st-acc">–</b></span>
            <span>差 <b id="st-delta">–</b></span>
            <span>閾 <b id="st-thr">–</b></span>
          </div>
          <button id="btn-end" class="end" aria-label="結束本輪">✕</button>
        </div>
        <p id="last" class="last">&nbsp;</p>
        <div class="pad">
          <button id="btn-replay" class="again">AGAIN<kbd>Space</kbd></button>
          <div class="pair">
            <button data-answer="first">1<kbd>←</kbd></button>
            <button data-answer="second">2<kbd>→</kbd></button>
          </div>
          <button data-answer="same" class="same">SAME<kbd>↓</kbd></button>
        </div>
      </div>
    </section>

    <section id="view-history" class="view" hidden>
      <h2>最近各輪</h2>
      <div class="table-wrap">
        <table id="tbl-sessions">
          <thead><tr><th>日期</th><th>題數</th><th>正確率</th><th>同音誤判</th><th>閾值</th><th>干擾</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="no-sessions" class="hint">還沒有紀錄。</p>

      <h2>分音區（全部紀錄）</h2>
      <div class="table-wrap">
        <table id="tbl-octaves">
          <thead><tr><th>音區</th><th>不同題</th><th>正確率</th><th>平均差距</th><th>同音誤判</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <p class="hint">閾值是自適應難度收斂的差距（約 71% 答對）。平均差距是該音區題目差距的幾何平均。</p>
      <button id="btn-clear" class="link">清除所有紀錄</button>
    </section>

    <section id="view-settings" class="view" hidden>
      <form id="settings" class="form">
        <label>標準音 A4 (Hz)
          <input name="a4" type="number" min="380" max="480" step="0.1" inputmode="decimal">
        </label>
        <div class="row2">
          <label>音域下限<select name="low"></select></label>
          <label>音域上限<select name="high"></select></label>
        </div>
        <label>每音長度
          <select name="dur">
            <option value="0.35">0.35 秒</option>
            <option value="0.6">0.6 秒</option>
            <option value="0.9">0.9 秒</option>
            <option value="1.4">1.4 秒</option>
          </select>
        </label>
        <label>起始差距 (cents)
          <input name="startDelta" type="number" min="1" max="200" step="1" inputmode="numeric">
        </label>
        <p class="hint">基準音在音域內連續隨機，不對齊音名。音色干擾在練習頁開始時選擇。設定會自動儲存；起始差距從下一輪開始生效。</p>
      </form>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
